# Checks that do not need the game: src/ tests, patches on PS2Recomp and the runtime suite.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  overrides:
    name: Quick checks (config, scripts and src/)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Validate config/funcmap.csv and config/recomp.template.toml
        run: python3 tools/ci/validate_config.py
      - name: Test the GIF packet inspector
        run: python3 -m unittest discover -s tests -p test_gif_inspector.py
      - name: Test the VIF chain selection
        run: python3 -m unittest discover -s tests -p test_vif_chain_extractor.py
      - name: Test the performance window selection
        run: python3 -m unittest discover -s tests -p test_perf_summary.py
      - name: Test reading the PCSX2 reference without the game
        run: python3 -m unittest discover -s tests -p test_pcsx2_ee_reference.py
      - name: Test the shared image inspector
        run: python3 -m unittest discover -s tests -p test_shared_frames.py
      - name: Test the private transition control without the game
        run: python3 -m unittest discover -s tests -p test_transition_control.py
      - name: Analyze the PowerShell scripts
        shell: pwsh
        run: ./tools/ci/analyze_ps1.ps1
      - name: Test the performance profile watch
        shell: pwsh
        run: ./tests/perf_guard_test.ps1
      - name: Build and run tests/pad2_packet_test.cpp
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/pad2_packet_test.cpp -o pad2_packet_test
          ./pad2_packet_test
      - name: Test digital script, stick and durations without the game
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/pad_script_test.cpp -o pad_script_test
          ./pad_script_test
      - name: Test the experimental GIF transport to PCSX2
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/pcsx2_gif_bridge_test.cpp -o pcsx2_gif_bridge_test
          ./pcsx2_gif_bridge_test
      - name: Test reading camera matrices without the game
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/camera_probe_test.cpp -o camera_probe_test
          ./camera_probe_test
      - name: Test the PS2 privileged register mirror
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/pcsx2_privileged_mirror_test.cpp -o pcsx2_privileged_mirror_test
          ./pcsx2_privileged_mirror_test
      - name: Test the ordered, bounded GS consumer queue
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror -pthread tests/pcsx2_queue_test.cpp -o pcsx2_queue_test
          ./pcsx2_queue_test
      - name: Test intro sampling and model reading without the game
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/model_probe_test.cpp -o model_probe_test
          ./model_probe_test
      - name: Test reading skinning output, scratchpad and returns
        run: |
          g++ -std=c++20 -Wall -Wextra -Werror tests/skin_probe_test.cpp -o skin_probe_test
          ./skin_probe_test

  pcsx2_bridge:
    name: Experimental GIF connection with real PCSX2 headers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: PCSX2/pcsx2
          ref: 2954ebe6965669219f1bbd256e958fbd8f83a85d
          path: pcsx2-reference
          sparse-checkout: |
            common
            pcsx2
            3rdparty/fmt
      - name: Build the connection against the real GSState and GSRenderer
        run: |
          g++ -std=c++20 -march=x86-64-v3 -fsyntax-only tests/pcsx2_gif_sink_syntax.cpp \
            -I pcsx2-reference -I pcsx2-reference/pcsx2 -I pcsx2-reference/3rdparty/fmt/include
          g++ -std=c++20 -march=x86-64-v3 -fsyntax-only tests/pcsx2_gif_parser_probe.cpp \
            -I pcsx2-reference -I pcsx2-reference/pcsx2 -I pcsx2-reference/3rdparty/fmt/include
          g++ -std=c++20 -march=x86-64-v3 -fsyntax-only tests/pcsx2_privileged_layout_syntax.cpp \
            -I pcsx2-reference -I pcsx2-reference/pcsx2 -I pcsx2-reference/3rdparty/fmt/include

  pcsx2_native:
    name: Isolated GS module on Windows (link and parser, no GPU)
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/checkout@v5
        with:
          repository: PCSX2/pcsx2
          ref: 2954ebe6965669219f1bbd256e958fbd8f83a85d
          path: pcsx2-reference
          sparse-checkout: |
            common
            pcsx2
            3rdparty
            bin/resources/shaders
      - uses: actions/checkout@v5
        with:
          repository: microsoft/DirectX-Headers
          ref: 64c650b0c6642ab0f3cdf674e38401e02ccd2460
          path: directx-headers
      - uses: actions/checkout@v5
        with:
          repository: microsoft/vcpkg
          ref: e456309491fd875487bf02b8a0dca76c1b1b00cc
          path: vcpkg-reference
      - uses: actions/cache@v4
        with:
          path: vcpkg-reference/installed
          key: windows-vcpkg-e456309-libpng-x64-static-md
      - name: Prepare static libpng and zlib, no private DLL
        shell: pwsh
        run: |
          ./vcpkg-reference/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./vcpkg-reference/vcpkg.exe install libpng:x64-windows-static-md --disable-metrics
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Extract dependencies of the pinned revision, without the game
        run: python tools/render/pcsx2_probe/prepare.py --pcsx2-source pcsx2-reference --output pcsx2-generated
      - name: Build module and fixtures; run parser and memory, no device
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat" >nul
          if errorlevel 1 exit /b 1
          cmake -S tools/render/pcsx2_probe -B pcsx2-probe-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPCSX2_SOURCE="%CD%/pcsx2-reference" -DPROBE_GENERATED="%CD%/pcsx2-generated" -DDIRECTX_HEADERS="%CD%/directx-headers" -DCMAKE_TOOLCHAIN_FILE="%CD%/vcpkg-reference/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static-md
          if errorlevel 1 exit /b 1
          cmake --build pcsx2-probe-build --parallel 3
          if errorlevel 1 exit /b 1
          ctest --test-dir pcsx2-probe-build --output-on-failure
          if errorlevel 1 exit /b 1

  runtime:
    name: Patches and runtime suite (PS2Recomp)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          path: gow

      # The pinned commit lives in scripts/common.ps1, same as in the Windows build
      - name: Read the pinned PS2Recomp commit
        id: ps2recomp
        run: |
          commit=$(grep -oP "PS2RecompCommit\s*=\s*'\K[0-9a-f]{40}" gow/scripts/common.ps1)
          echo "commit=$commit" >> "$GITHUB_OUTPUT"
          echo "PS2Recomp @ $commit"

      - name: Download PS2Recomp
        run: |
          git init -q PS2Recomp
          git -C PS2Recomp fetch -q --depth 1 https://github.com/ran-j/PS2Recomp.git ${{ steps.ps2recomp.outputs.commit }}
          git -C PS2Recomp checkout -q FETCH_HEAD

      # Same patches, order and options as scripts/build.ps1 (tools/ci/patches.py reads them from there)
      - name: Apply the patches
        working-directory: PS2Recomp
        run: |
          patches=$(python3 ../gow/tools/ci/patches.py)
          for p in $patches; do
            echo "::group::$(basename "$p")"
            git apply --ignore-whitespace --verbose "$p"
            echo "::endgroup::"
          done

      # With the runtime already patched: every stub of recomp.template.toml must have a handler
      - name: Check the stub handlers
        run: python3 gow/tools/ci/validate_config.py --runtime PS2Recomp

      - name: Install dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ninja-build libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev \
            libgl1-mesa-dev libavcodec-dev libavformat-dev libavutil-dev libswresample-dev libswscale-dev

      # -march=x86-64-v2: the runtime uses SSE4.1 intrinsics that GCC only accepts with that target
      - name: Build ps2x_tests and the FINISH and VU1 checks
        working-directory: PS2Recomp
        run: |
          cat >> CMakeLists.txt <<'CMAKE'

          include("${CMAKE_SOURCE_DIR}/../gow/tools/ci/gs_tests.cmake")
          include("${CMAKE_SOURCE_DIR}/../gow/tools/ci/vu1_tests.cmake")
          CMAKE
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DPS2X_BUILD_STUDIO=OFF \
            -DCMAKE_C_FLAGS=-march=x86-64-v2 -DCMAKE_CXX_FLAGS=-march=x86-64-v2
          ninja -C build ps2x_tests gow_gs_finish_async_test gow_vu1_compiled_test gow_vu1_fmac_test

      # src/gow_overrides.cpp is only really built together with the generated game code (Windows). Here it is
      # checked against the headers of the already patched runtime, declaring the sub_* it uses.
      - name: Build src/ against the patched runtime
        run: |
          mkdir -p generated
          {
            echo '#pragma once'
            echo '#include "ps2_runtime.h"'
            grep -ho 'sub_[0-9A-F]\{8\}_0x[0-9a-f]\+' gow/src/*.cpp | sort -u |
              sed 's/.*/void &(uint8_t *rdram, R5900Context *ctx, PS2Runtime *runtime);/'
          } > generated/ps2_recompiled_functions.h
          for f in gow/src/*.cpp; do
            echo "$f"
            g++ -std=c++20 -march=x86-64-v2 -fsyntax-only \
              -IPS2Recomp/ps2xRuntime/include -IPS2Recomp/ps2xRuntime/src/lib -IPS2Recomp/ps2xIOP/include \
              -IPS2Recomp/build/_deps/raylib-src/src -Igenerated -Igow/src "$f"
          done

      - name: Test the VU1 generator and the compiled pairs with procedural microcode
        run: python3 gow/tests/vu1_compiled_cli_test.py PS2Recomp/build/gow_vu1_compiled_test

      - name: Test default and optional FINISH with synchronized reads
        run: |
          timeout 30 PS2Recomp/build/gow_gs_finish_async_test default
          timeout 30 PS2Recomp/build/gow_gs_finish_async_test async

      - name: Test every compiled VU1 FMAC against the interpreter with boundary values
        # GOW-Port: the native VU1 goes first in Waffle565's runtime; it is turned off to compare the compiled one.
        run: GOW_VU1_NATIVE_OFF=1 PS2Recomp/build/gow_vu1_fmac_test 200

      - name: Run the suite
        working-directory: PS2Recomp
        run: |
          set +e
          timeout 1200 ./build/ps2xTest/ps2x_tests 2> ../ps2x_tests.err | python3 ../gow/tools/ci/check_tests.py ../gow/tests/known_failures.txt
          status=${PIPESTATUS[1]}
          if [ "$status" -ne 0 ]; then
            echo "::group::suite stderr (last 200 lines)"
            tail -n 200 ../ps2x_tests.err
            echo "::endgroup::"
          fi
          exit "$status"
