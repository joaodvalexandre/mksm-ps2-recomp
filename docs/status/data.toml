# Data of the status map (docs/status/map.svg and docs/status/details.md).
# After editing this file, regenerate with:  python tools/status/generate.py
# (The "Status map" GitHub action does it by itself when changes are pushed to main.)
#
# Statuses: "ok" (works), "partial" (works with flaws or unverified), "pending" (does not work / not emulated).

# ---------------------------------------------------------------------------------------------------------
# Panel 1: static Sony SDK libraries linked into the game ELF.
# Each function of config/funcmap.csv between `from` and `to` is a cell. A library starts at `start` and runs
# until the start of the next one (the linker places them one after another). The starts come from the named
# functions of config/recomp.template.toml. Several entries with the same `name` are merged.
# ---------------------------------------------------------------------------------------------------------
[libraries]
from = 0x0026F228
to = 0x0029BBA4

[[libraries.group]]
name = "libmpeg"
start = 0x0026F228
status = "partial"
note = "Movies through native libmpeg2 with sound: 61 of 67 correct here; SEMO08 (drift), P04MP05 (stops) and BONUS20 (no audio) fail"

