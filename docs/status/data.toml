# Data of the status map (docs/status/map.svg and docs/status/details.md).
# After editing this file, regenerate with:  python tools/status/generate.py
# (The "Status map" GitHub action does it by itself when changes are pushed to master.)
#
# Statuses: "ok" (works), "partial" (works with flaws or unverified), "pending" (does not work / not emulated).

# ---------------------------------------------------------------------------------------------------------
# Panel 1: static Sony SDK libraries linked into the game ELF (SLES_535.24).
# Each function of config/funcmap.csv between `from` and `to` is a cell. A library starts at `start` and runs
# until the start of the next one. The starts come from the SDK names the analyzer found (config/funcmap.csv).
# This ELF links the libraries in several runs with game code in between: those ranges are `skip = true`.
# Several entries with the same `name` are merged.
# ---------------------------------------------------------------------------------------------------------
